<!DOCTYPE html>

    <script>
        (function () {
            try {
                var theme = localStorage.getItem('sys_theme') || 'dark';
                var isLight = theme === 'light';
                var de = document.documentElement;
                de.setAttribute('data-theme', isLight ? 'light' : 'dark');
                de.style.backgroundColor = isLight ? '#f1f5f9' : '#0b0f19';
            } catch (_) {}
        })();
    </script>    <meta charset="UTF-8">

    <div class="app-container">

    <script>
        // دوال المودال المصغّرة — مستقلة عن script.js
        (function () {
            window.openModalLayer = function (el, focusSel) {
                if (!el) return;
                el.removeAttribute('inert');
                el.classList.add('active');
                document.body.style.overflow = 'hidden';
                requestAnimationFrame(function () {
                    requestAnimationFrame(function () {
                        var inp = focusSel
                            ? el.querySelector(focusSel)
                            : el.querySelector('input:not([type="hidden"]):not([disabled]),select:not([disabled]),textarea:not([disabled])');
                        if (inp) { try { inp.focus({ preventScroll: true }); } catch (e) {} }
                    });
                });
            };
            window.closeModalLayer = function (el) {
                if (!el) return;
                el.classList.remove('active');
                document.body.style.overflow = '';
            };
        })();
    </script>
    <script src="delivery-companies.js"></script>
    <script>
        // Load sidebar dynamically
        fetch('index.html').then(r => r.text()).then(html => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            const sidebar = doc.querySelector('.sidebar');
            if (sidebar) {
                document.getElementById('sidebar-placeholder').innerHTML = sidebar.innerHTML;
                // Run sidebar logic
                const script = document.createElement('script');
                script.src = 'update_sidebar.js';
                document.body.appendChild(script);
            }
        });
    </script>
</body>
</html>
