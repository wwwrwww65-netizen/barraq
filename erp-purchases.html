
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة المشتريات الإدارية</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="node_modules/@fontsource/cairo/index.css">
    <link rel="stylesheet" href="node_modules/@phosphor-icons/web/src/regular/style.css">
    <link rel="stylesheet" href="node_modules/@phosphor-icons/web/src/fill/style.css">
    <script src="demo-mock.js"></script>
    <style>
        .erp-sales-grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 20px; }
        .doc-list { background: var(--bg-card); border-radius: 8px; padding: 15px; border: 1px solid var(--border-color); height: calc(100vh - 120px); overflow-y: auto; }
        .doc-item { padding: 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; border-radius: 6px; margin-bottom: 8px; background: rgba(0,0,0,0.1); transition: 0.2s; }
        .doc-item:hover, .doc-item.active { background: rgba(59, 130, 246, 0.1); border-left: 3px solid var(--accent-blue); }
        .doc-detail { background: var(--bg-card); border-radius: 8px; padding: 20px; border: 1px solid var(--border-color); height: calc(100vh - 120px); overflow-y: auto; }
        .doc-badge { padding: 3px 8px; border-radius: 12px; font-size: 11px; }
        .doc-badge.quotation { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .doc-badge.order { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .doc-badge.delivery { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
        .doc-badge.invoice { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .form-control { width: 100%; padding: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 6px; font-family: inherit; }
        .table-input { width: 100%; background: transparent; border: 1px solid transparent; color: inherit; padding: 5px; text-align: center; font-family: inherit; }
        .table-input:focus { border-color: var(--accent-blue); outline: none; background: rgba(0,0,0,0.2); }
        .doc-actions-top { display: flex; gap: 10px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); }
    </style>
</head>
<body class="dark-theme">
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <span>Mister Casher <span class="highlight">ERP</span></span>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-item"><i class="ph ph-arrow-right"></i><span>العودة للرئيسية</span></a>
                <a href="erp-sales.html" class="nav-item"><i class="ph ph-file-text"></i><span>المبيعات الإدارية</span></a>
                <a href="#" class="nav-item active"><i class="ph ph-shopping-cart"></i><span>المشتريات الإدارية</span></a>
                <a href="receivables.html" class="nav-item"><i class="ph ph-money"></i><span>التحصيل والمقبوضات</span></a>
            </nav>
        </aside>
        <main class="main-content">
            <header class="top-header" style="padding: 15px 20px; border-bottom: 1px solid var(--border-color);">
                <h2>المشتريات الإدارية (أوامر شراء، أذونات استلام، فواتير)</h2>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-outline" onclick="createNewDoc('order')"><i class="ph ph-plus"></i> أمر شراء</button>
                    <button class="btn btn-primary" onclick="createNewDoc('invoice')"><i class="ph ph-plus"></i> فاتورة مشتريات</button>
                </div>
            </header>

            <div class="erp-sales-grid">
                <div class="doc-list" id="doc-list-container">
                    <!-- Docs injected via JS -->
                </div>

                <div class="doc-detail" id="doc-detail-container">
                    <div style="text-align:center; padding:50px; color:var(--text-muted);">
                        <i class="ph ph-shopping-cart" style="font-size:64px; margin-bottom:15px; opacity:0.5;"></i>
                        <h3>اختر مستنداً أو قم بإنشاء مستند جديد</h3>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script src="erp-purchases.js"></script>
</body>
</html>
