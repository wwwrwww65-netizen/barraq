<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب المدير - Mister Casher</title>
  <link rel="stylesheet" href="node_modules/@fontsource/cairo/index.css">
  <link rel="stylesheet" href="node_modules/@phosphor-icons/web/src/regular/style.css">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#123047 0,transparent 36%),linear-gradient(135deg,#020617,#0f172a 55%,#06111f);color:#f8fafc;font-family:Cairo,sans-serif}
    .card{width:min(100%,520px);padding:34px;background:rgba(15,23,42,.94);border:1px solid rgba(148,163,184,.2);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.42)}
    .brand{text-align:center;margin-bottom:26px}.brand img{width:62px;height:62px;object-fit:contain;border-radius:16px}.brand h1{font-size:23px;margin:10px 0 4px}.brand p{font-size:13px;color:#94a3b8;margin:0}
    .notice{padding:12px 14px;margin-bottom:20px;border:1px solid rgba(59,130,246,.3);background:rgba(59,130,246,.09);border-radius:12px;font-size:12px;line-height:1.8;color:#cbd5e1}
    .field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid #334155;background:#0b1220;color:#fff;font:inherit;outline:none}.field input:focus{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.12)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.submit{width:100%;border:0;border-radius:12px;padding:14px;background:linear-gradient(135deg,#10b981,#059669);color:white;font:700 15px Cairo;cursor:pointer;margin-top:7px}.submit:disabled{opacity:.55;cursor:wait}
    .message{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:13px;line-height:1.7}.message.error{display:block;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fecaca}.message.success{display:block;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#a7f3d0}
    .foot{text-align:center;color:#64748b;font-size:11px;margin-top:22px}
    @media(max-width:520px){.card{padding:24px 18px}.row{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="card">
    <header class="brand">
      <img src="2222.png" alt="Mister Casher">
      <h1>إنشاء حساب مدير المنشأة</h1>
      <p>خطوة واحدة لتفعيل حسابك الإداري السحابي</p>
    </header>

    <div class="notice">
      لا يمكن إنشاء حساب المدير إلا بعد موافقة مالك النظام. أدخل رمز الاعتماد الذي استلمته بعد الموافقة.
      سيُنشأ الحساب باسم مستخدم وكلمة مرور فقط، ولن تحتاج إلى بريد إلكتروني.
    </div>

    <form id="manager-setup-form" autocomplete="off">
      <div class="field">
        <label for="claim-token">رمز اعتماد المدير</label>
        <input id="claim-token" type="text" minlength="32" maxlength="128" required spellcheck="false" placeholder="أدخل رمز الاعتماد">
      </div>

      <div class="row">
        <div class="field">
          <label for="manager-username">اسم المستخدم</label>
          <input id="manager-username" type="text" minlength="3" maxlength="32" required autocomplete="username" placeholder="اسم المستخدم">
        </div>
        <div class="field">
          <label for="manager-name">الاسم الكامل</label>
          <input id="manager-name" type="text" maxlength="100" required placeholder="اسم المدير">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="manager-password">كلمة المرور</label>
          <input id="manager-password" type="password" minlength="8" maxlength="128" required autocomplete="new-password" placeholder="8 خانات على الأقل">
        </div>
        <div class="field">
          <label for="manager-password-confirm">تأكيد كلمة المرور</label>
          <input id="manager-password-confirm" type="password" minlength="8" maxlength="128" required autocomplete="new-password" placeholder="أعد كتابة كلمة المرور">
        </div>
      </div>

      <button class="submit" id="manager-setup-submit" type="submit">
        إنشاء حساب المدير <i class="ph ph-arrow-left"></i>
      </button>
      <div class="message" id="manager-setup-message" role="status" aria-live="polite"></div>
    </form>

    <div class="foot">Mister Casher · حماية الحسابات عبر Firebase Authentication</div>
  </main>
  <script src="manager-setup.js"></script>
</body>
</html>
